<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>HP Garments</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
header{background:#000;padding:22px;border-bottom:2px solid #d4af37}
header h1{margin:0;color:#d4af37}
header p{margin:6px 0 0;color:#ccc}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#202020}
button{background:#d4af37;color:#000;border:0;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer}
nav button{flex:1;min-width:90px}
main{padding:15px}
.card{background:#222;border:1px solid #444;padding:16px;border-radius:12px;margin-bottom:12px}
input,select{width:100%;padding:12px;margin:6px 0;background:#333;color:#fff;border:1px solid #555;border-radius:6px}
h2{color:#d4af37}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #444;text-align:left}
.small{color:#bbb;font-size:13px}
</style>
</head>
<body>
<header>
<h1>HP GARMENTS</h1>
<p>Uniform Manufacturing & Clothing Management</p>
</header>
<nav>
<button onclick="show('home')">Home</button>
<button onclick="show('products')">Products</button>
<button onclick="show('customers')">Customers</button>
<button onclick="show('billing')">Billing</button>
</nav>
<main id="app"></main>
<script>
const app=document.getElementById('app');
let products=JSON.parse(localStorage.getItem('hp_products')||'[]');
let customers=JSON.parse(localStorage.getItem('hp_customers')||'[]');
let bills=JSON.parse(localStorage.getItem('hp_bills')||'[]');

function save(){
 localStorage.setItem('hp_products',JSON.stringify(products));
 localStorage.setItem('hp_customers',JSON.stringify(customers));
 localStorage.setItem('hp_bills',JSON.stringify(bills));
}
function show(page){
 if(page==='home'){
 app.innerHTML=`<div class="card"><h2>Dashboard</h2>
 <p>Products: ${products.length}</p><p>Customers: ${customers.length}</p>
 <p>Total Bills: ${bills.length}</p></div>
 <div class="card"><h2>Welcome to HP Garments</h2>
 Manage uniforms, stock and customer billing from your phone.</div>`;
 }
 if(page==='products'){
 app.innerHTML=`<div class="card"><h2>Add Product</h2>
 <input id="pn" placeholder="Product name">
 <input id="ps" placeholder="Size (S, M, L, XL or custom)">
 <input id="pq" type="number" placeholder="Quantity">
 <input id="pr" type="number" placeholder="Price ₹">
 <button onclick="addProduct()">Save Product</button></div>
 <div class="card"><h2>Inventory</h2>${products.map(p=>`<p>${p.name} | ${p.size} | Qty: ${p.qty} | ₹${p.price}</p>`).join('')}</div>`;
 }
 if(page==='customers'){
 app.innerHTML=`<div class="card"><h2>Add Customer</h2>
 <input id="cn" placeholder="Customer name">
 <input id="cp" placeholder="Phone">
 <input id="ca" placeholder="Address">
 <button onclick="addCustomer()">Save Customer</button></div>
 <div class="card"><h2>Customers</h2>${customers.map(c=>`<p>${c.name} | ${c.phone}</p>`).join('')}</div>`;
 }
 if(page==='billing'){
 app.innerHTML=`<div class="card"><h2>Create Bill</h2>
 <input id="bn" placeholder="Customer name">
 <select id="bt"><option value="GST">GST Bill</option><option value="Non-GST">Non-GST Bill</option></select>
 <input id="bd" placeholder="Description">
 <input id="bq" type="number" placeholder="Quantity">
 <input id="br" type="number" placeholder="Rate ₹">
 <button onclick="addBill()">Save Bill</button></div>
 <div class="card"><h2>Bills</h2>${bills.map(b=>`<p>${b.name} | ${b.type} | ₹${b.total}</p>`).join('')}</div>`;
 }
}
function addProduct(){
 products.push({name:pn.value,size:ps.value,qty:pq.value,price:pr.value});
 save();show('products');
}
function addCustomer(){
 customers.push({name:cn.value,phone:cp.value,address:ca.value});
 save();show('customers');
}
function addBill(){
 let total=Number(bq.value)*Number(br.value);
 bills.push({name:bn.value,type:bt.value,desc:bd.value,total:total});
 save();show('billing');
}
show('home');
</script>
</body>
</html>
